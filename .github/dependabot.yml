# ================================================================
# Mise à jour automatisée des dépendances — myvisuals-client
# ================================================================
# Politique complète, critères d'arbitrage et procédure de retour arrière :
#   https://github.com/flavienderoy/myvisuals-back/blob/main/docs/PROCESSUS_DEPENDANCES.md
#
# Principe : Dependabot ouvre les pull requests, la chaîne d'intégration
# continue les valide (lint → tests → build → E2E → audit), et la décision de
# fusion reste humaine.
version: 2

updates:
  # ─────────────────────────────────────────────────────────────
  # Dépendances npm de l'application front
  # ─────────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/Paris'

    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'area:front'
    commit-message:
      # prefix 'chore' + include 'scope' → « chore(deps): … » / « chore(deps-dev): … ».
      # Un prefix 'chore(deps)' combiné au scope produisait « chore(deps)(deps): ».
      prefix: 'chore'
      include: 'scope'

    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: 'production'
        update-types: ['minor', 'patch']

      development:
        applies-to: version-updates
        dependency-type: 'development'
        update-types: ['minor', 'patch', 'major']

      security:
        applies-to: security-updates
        patterns: ['*']

    ignore:
      # Les montées MAJEURES des dépendances de production ne passent jamais par
      # une pull request automatique : elles impliquent des changements
      # incompatibles à évaluer, et passent par une issue dédiée avec plan de
      # test (§ 4.3 du processus).
      #
      # Les dépendances sont énumérées nommément : le schéma Dependabot
      # n'autorise PAS `dependency-type` dans un bloc `ignore`. Une première
      # version de ce fichier l'utilisait — Dependabot rejetait alors
      # l'intégralité de la configuration et ne produisait aucune pull request,
      # sans que rien ne le signale hors de l'onglet Insights → Dependabot.
      - dependency-name: '@sentry/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@supabase/supabase-js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'axios'
        update-types: ['version-update:semver-major']
      - dependency-name: 'framer-motion'
        update-types: ['version-update:semver-major']
      - dependency-name: 'gsap'
        update-types: ['version-update:semver-major']
      - dependency-name: 'hls.js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jspdf'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jspdf-autotable'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-hot-toast'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'swiper'
        update-types: ['version-update:semver-major']

  # ─────────────────────────────────────────────────────────────
  # Actions GitHub
  # ─────────────────────────────────────────────────────────────
  # Une action compromise s'exécute avec les secrets du dépôt — dont le jeton
  # de déploiement Vercel.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'area:cicd'
      - 'security'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
